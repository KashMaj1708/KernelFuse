# Pre-registered config matrix — Phase 5 v1
# Do not edit mid-run. Bump matrix_version for any change.
# HARNESS-PROOF RECORD ONLY — real serving sweeps use phase6-v1 (do not edit this file).
matrix_version: phase5-v1
description: >
  Tier-A harness debug on GTX 1650 (4 GB). Toy model / mock only.
  Written before first measurement. Kept as the immutable harness-proof record.

hardware_tier: A
device_hint: "NVIDIA GeForce GTX 1650 4GB"

backends:
  - mock          # deterministic fake latency — proves harness math
  - hf_local      # transformers streaming generate — proves GPU + TTFT/TPOT path

models:
  mock: mock-toy
  # tiny-gpt2 ships only .bin; torch 2.5.1 + new transformers require safetensors.
  hf_local: hf-internal-testing/tiny-random-gpt2

sweep:
  batch_size: [1, 2, 4]
  input_tokens: [32, 128]
  output_tokens: [16, 64]
  # PLACEHOLDER on Phase 5 backends: hf_local serializes under a CUDA lock;
  # mock only overlaps sleep. Do not read c>1 as a scheduling result.
  concurrency: [1, 2]

run:
  warmup_requests: 4
  num_requests: 32
  seed: 0
  # e2e + TTFT + TPOT percentiles; system_throughput and mean_per_request tok/s.
  report_percentiles: [50, 90, 99]

exclude: []
